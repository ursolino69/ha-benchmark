name: HA Benchmark
version: "0.8.0"
slug: smartdomo_benchmark
description: Home-Assistant-Benchmark mit Smartdomo Index, Light/Full und Community-Vergleich
url: https://smartdomo.de
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:speedometer
panel_title: HA Benchmark
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: default
tmpfs: false
stage: experimental
options:
  allow_full_benchmark: false
  device_name: ""
  device_type: "auto"
  cpu_model: ""
  storage_type: "unknown"
  storage_size_gb: 0
  temperature_entity: ""
  power_entity: ""
schema:
  allow_full_benchmark: bool
  device_name: str
  device_type: list(auto|green|yellow|blue|rpi3|rpi4|rpi5|odroid|avatto_ha80|x86_64|arm64|vm|other)
  cpu_model: str
  storage_type: list(unknown|sd|emmc|sata_ssd|nvme|virtual)
  storage_size_gb: int
  temperature_entity: str
  power_entity: str
